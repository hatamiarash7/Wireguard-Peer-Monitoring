[project]
authors = [{name = "Arash Hatami", email = "hatamiarash7@gmail.com"}]
dependencies = [
  "httpx>=0.28,<0.29",
  "loguru>=0.7.2,<0.8",
  "prometheus-client>=0.26,<0.27",
  "redis>=8,<9",
  "toml>=0.10.2,<0.11",
]
description = "Monitor WireGuard peers using kernel events"
license = "MIT"
name = "wireguard-peer-monitoring"
readme = "README.md"
requires-python = ">=3.10,<4.0"
version = "1.3.0"

[tool.poetry]
packages = [{include = "monitoring"}]

[tool.poetry.group.test.dependencies]
fakeredis = {version = "^2.40.0", extras = ["lua"]}
pytest = "^9.0.0"
pytest-cov = "^7.0.0"

[tool.poetry.group.dev.dependencies]
bandit = "^1.8.6"
black = ">=25,<27"
flake8-pyproject = "^1.2.4"
isort = "^9.0.0"
pylint = "^4.0.0"

[project.urls]
"Bug Tracker" = "https://github.com/hatamiarash7/wireguard-peer-monitoring/issues"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=monitoring --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
source = ["monitoring"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.flake8]
ignore = ["E501"]

[project.scripts]
wg-peer-monitoring = "monitoring.main:main"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0,<3.0"]
